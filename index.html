<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis Quincenas</title>
<meta name="description" content="Tu plata por quincena: cuánto puedes gastar, qué te falta pagar y cómo van tus metas.">
<meta name="theme-color" content="#2446C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quincenas">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app de bolsillo — barra inferior con botón central para registrar, una columna de máx. 680px, tarjetas solo donde hay una acción */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E9EEEC; --ink:#14201C; --muted:#5C6B66; --line:#D8DFDC;
  --accent:#2446C8; --accent-ink:#FFFFFF; --accent-soft:#E5EAFB;
  --good:#1E8A57; --good-soft:#E1F2E9; --warn:#A8670E; --warn-soft:#FAEED8; --bad:#C2372B; --bad-soft:#FBE3E0;
  --c1:#2446C8; --c2:#1E8A57; --c3:#B4521C; --c4:#7A3DB8; --c5:#0F7C8C; --c6:#A8670E;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151D1A; --sunk:#1B2521; --ink:#E6EDEA; --muted:#93A29C; --line:#27332F;
  --accent:#8EA5FF; --accent-ink:#0D1311; --accent-soft:#1D2547;
  --good:#4CC38A; --good-soft:#123024; --warn:#E6AA4A; --warn-soft:#33260F; --bad:#F07A6E; --bad-soft:#3A1A17;
  --c1:#8EA5FF; --c2:#4CC38A; --c3:#F0955E; --c4:#C29BF0; --c5:#4FC6D6; --c6:#E6AA4A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --sunk:#1B2521; --ink:#E6EDEA; --muted:#93A29C; --line:#27332F;
  --accent:#8EA5FF; --accent-ink:#0D1311; --accent-soft:#1D2547;
  --good:#4CC38A; --good-soft:#123024; --warn:#E6AA4A; --warn-soft:#33260F; --bad:#F07A6E; --bad-soft:#3A1A17;
  --c1:#8EA5FF; --c2:#4CC38A; --c3:#F0955E; --c4:#C29BF0; --c5:#4FC6D6; --c6:#E6AA4A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
section{display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.08rem;font-weight:600}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.status{font-size:.78rem;color:var(--muted)}

/* Cabecera de la quincena */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.qpick{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;line-height:1;display:grid;place-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:500}

/* Héroe: libre para gastar */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-num);font-size:2.4rem;line-height:1.1;letter-spacing:-.03em;overflow-wrap:anywhere}
.hero p{margin:0;font-size:.88rem;opacity:.85}
.hero.neg{background:var(--bad);color:#fff}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.trio div{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;min-width:0}
.trio b{display:block;font-family:var(--f-num);font-weight:500;font-size:.95rem;overflow-wrap:anywhere}
.trio span{font-size:.72rem;opacity:.85}

/* Pendientes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:transparent}
.todo.done .check{background:var(--good);border-color:var(--good);color:#fff}
.todo.done .tn{color:var(--muted);text-decoration:line-through}
.tn{font-weight:500;overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.ghost{border-style:dashed;color:var(--muted);background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.wide{width:100%}

/* Atajos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* Presupuesto */
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .n{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.brow .r{text-align:right;font-size:.85rem}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--bad)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent)}

/* Movimientos */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:.85rem;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding-top:6px}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:600;font-size:.9rem;color:#fff}
.mov b{display:block;font-weight:500;overflow-wrap:anywhere}
.mov span.s{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Metas */
.progress{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:6px}
.progress i.good{background:var(--good)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kv div{min-width:0} .kv b{display:block;font-family:var(--f-num);font-weight:500;font-size:1.05rem;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
details summary{cursor:pointer;font-weight:500;color:var(--accent)}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:.8rem;color:var(--muted);font-weight:500}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.erow{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.erow .opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:.85rem}
.erow .opts label{display:inline-flex;align-items:center;gap:6px}
.erow .opts select{width:auto;padding:6px 8px}
.alert{border-radius:12px;padding:12px 14px;font-size:.9rem;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.good{background:var(--good-soft);border-color:var(--good)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .wrap{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;gap:4px}
.tabbar button{border:0;background:none;padding:6px 4px;font-size:.75rem;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--accent)}
.tabbar .plus{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;line-height:1;margin-top:-22px;box-shadow:0 6px 18px rgba(20,32,28,.25);display:grid;place-items:center}

/* Hoja de registro */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;max-height:94vh;overflow-y:auto}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{font-family:var(--f-num);font-size:2.2rem;text-align:center;border:0;background:none;padding:6px 0;letter-spacing:-.03em}
.amount:focus{outline:none}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:.82rem;font-family:var(--f-num)}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.catgrid button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;font-size:.88rem}
.catgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

.av{border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display);overflow:hidden;flex:none}
.hello{display:flex;gap:12px;align-items:center}
.hello button{border:0;background:none;padding:0;border-radius:50%}
.hello b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.2}
.profile-top{display:flex;gap:16px;align-items:center}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.tabav{width:24px;height:24px;border-radius:50%;object-fit:cover}
.seg.two{grid-template-columns:1fr 1fr}
.hb{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line);outline-offset:4px}
.hb:first-of-type{border-top:0}
.hb-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hb-n{font-weight:500;min-width:0;overflow-wrap:anywhere}
.hb-track{position:relative;height:12px;background:var(--sunk);border-radius:6px}
.hb-track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;min-width:0}
.hb-track i.over{background:var(--bad)}
.hb-mark,.lg-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;margin-left:-1px}
.lg-mark{position:relative;display:inline-block;height:12px;vertical-align:-2px;margin:0 4px 0 0;top:0}
.chart-wrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block;min-width:300px}
.chart .ax{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.chart .ax-on{fill:var(--ink);font-weight:600}
.chart .mk{transition:opacity .15s}
.chart .hit{cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sq{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .ln{width:18px;height:0;border-top:2px dashed var(--ink);display:inline-block}
.tip{margin:0;min-height:1.3em}.tip.on{color:var(--ink)}
.danger-zone{border-color:var(--bad)}
.catgrid .otra{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:99px;padding:8px 14px;font-weight:600}
.nuevacat{display:flex;gap:8px;width:100%;align-items:center}
.nuevacat input{flex:1;min-width:0}
.clave{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.trio.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.trio.four b{font-size:.85rem}
.hero.plan{background:var(--surface);color:var(--ink);border:1.5px dashed var(--line)}
.hero.plan .trio div{background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:.9rem;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent);font-weight:600;filter:brightness(1.4)}
@media (prefers-reduced-motion:no-preference){.bar i,.progress i{transition:width .45s ease}.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<main><div class="wrap" id="view">
  <div class="empty"><h2>Abriendo Mis Quincenas</h2><p>Aquí verás cuánto puedes gastar esta quincena, qué te falta pagar y cómo van tus metas.</p></div>
</div></main>

<nav class="tabbar" aria-label="Secciones" hidden><div class="wrap">
  <button data-view="inicio" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-view="movs" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button class="plus" id="plus" aria-label="Registrar movimiento">+</button>
  <button data-view="metas" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Resumen</button>
  <button data-view="ajustes" aria-current="false" id="tabPerfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Perfil</button>
</div></nav>

<div class="overlay" id="sheet" hidden>
  <form class="sheet" id="movForm" novalidate>
    <div class="grab"></div>
    <div class="row"><h2 id="sheetTitle">Nuevo movimiento</h2><button type="button" class="btn" id="closeSheet">Cerrar</button></div>
    <div class="seg" role="group" aria-label="Tipo de movimiento">
      <button type="button" data-tipo="gasto" aria-pressed="true">Gasto</button>
      <button type="button" data-tipo="ingreso" aria-pressed="false">Ingreso</button>
      <button type="button" data-tipo="ahorro" aria-pressed="false">Ahorro</button>
    </div>
    <label class="lbl" for="fMonto" style="text-align:center">¿Cuánto?</label>
    <input id="fMonto" class="amount" inputmode="numeric" autocomplete="off" placeholder="$ 0">
    <div class="quick" id="quick"></div>
    <div><div class="lbl" style="margin-bottom:6px">¿En qué?</div><div class="catgrid" id="catgrid"></div></div>
    <div id="deudabox"></div>
    <div class="grid2">
      <div class="field"><label for="fFecha">Fecha</label><input id="fFecha" type="date"></div>
      <div class="field"><label for="fNota">Descripción (opcional)</label><input id="fNota" autocomplete="off" maxlength="120" placeholder="Ej: cine con amigos"></div>
    </div>
    <p class="small neg" id="fErr" hidden></p>
    <button class="btn primary wide" type="submit" id="saveBtn">Guardar</button>
    <button class="btn danger wide" type="button" id="delBtn" hidden>Borrar este movimiento</button>
  </form>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastBtn" hidden>Deshacer</button></div>

<script>
const $=s=>document.querySelector(s);
const view=$('#view');
const COP=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const fmt=n=>COP.format(Math.round(n||0));
const fmtK=n=>{n=Math.round(n||0);return Math.abs(n)>=1e6?'$'+(n/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M':Math.abs(n)>=1e3?'$'+Math.round(n/1e3)+' mil':fmt(n)};
const parseMoney=s=>{const n=Number(String(s).replace(/[^\d]/g,''));return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const modoPago=()=>{let m=cfg&&cfg.modoQuincena;if(!m){try{m=localStorage.getItem('misquincenas.modo')}catch(e){}}return m==='pago_15_30'};
const lastDay=(y,m)=>new Date(y,m,0).getDate();
function qKey(f){const[y,m,d]=f.split('-').map(Number);
  if(modoPago()){if(d<15){const pm=m===1?12:m-1,py=m===1?y-1:y;return py+'-'+pad(pm)+'-2'}return y+'-'+pad(m)+'-'+(d>=Math.min(30,lastDay(y,m))?2:1)}
  return y+'-'+pad(m)+'-'+(d<=15?1:2)}
function qBounds(k){const[y,m,h]=k.split('-').map(Number),ld=lastDay(y,m),ds=(Y,M,D)=>Y+'-'+pad(M)+'-'+pad(D);
  if(modoPago()){const p2=Math.min(30,ld);if(h===1)return{start:ds(y,m,15),end:ds(y,m,p2-1)};return{start:ds(y,m,p2),end:m===12?ds(y+1,1,14):ds(y,m+1,14)}}
  return h===1?{start:ds(y,m,1),end:ds(y,m,15)}:{start:ds(y,m,16),end:ds(y,m,ld)}}
function diasEntre(a,b){const out=[],d=new Date(a+'T12:00'),e=new Date(b+'T12:00');while(d<=e){out.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));d.setDate(d.getDate()+1)}return out}
const fechaCorta=x=>+x.slice(8)+' '+MES[+x.slice(5,7)-1].slice(0,3);
function qShift(k,n){let[y,m,h]=k.split('-').map(Number);const i=(y*12+m-1)*2+h-1+n;y=Math.floor(i/24);const r=i-y*24;return y+'-'+pad(Math.floor(r/2)+1)+'-'+(r%2+1)}
function qInfo(k){const[y,m,h]=k.split('-').map(Number),B=qBounds(k),pago=modoPago();
  return{h,name:(h===1?'1ª':'2ª')+' quincena de '+MES[m-1],range:pago?'del '+fechaCorta(B.start)+' al '+fechaCorta(B.end):(h===1?'del 1 al 15':'del 16 al '+lastDay(y,m)),
    short:(h===1?'1ª ':'2ª ')+MES[m-1].slice(0,3)+(y!==new Date().getFullYear()?' '+String(y).slice(2):''),
    dateIn:()=>{const t=today();return qKey(t)===k?t:B.start},daysLeft:()=>{const t=today();if(qKey(t)!==k)return null;return diasEntre(t,B.end).length}}}
const sum=a=>a.reduce((t,m)=>t+(+m.monto||0),0);

let db=null,cfg=null,movs=[],curQ=qKey(today()),curView='inicio',loaded=false,pending=false,filtro='todos';
let sheet={tipo:'gasto',cat:'',editId:null};
let saving=Promise.resolve();

function toast(msg,undo){const t=$('#toast');$('#toastMsg').textContent=msg;const b=$('#toastBtn');b.hidden=!undo;b.onclick=()=>{t.hidden=true;undo&&undo()};t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,undo?5000:2400)}
function saveCfg(){if(!db||!cfg)return;const snap=JSON.parse(JSON.stringify(cfg));
  saving=saving.then(()=>db.doc('fin/config').set(snap)).catch(e=>toast('No se guardó el cambio. Revisa tu conexión.'))}

/* Cálculos */
const netoQ=()=>cfg?(cfg.salario/2)*(1-(cfg.ssPct||0)/100)+(cfg.otrosIngresos||0)/2:0;
const catById=id=>cfg&&cfg.categorias.find(c=>c.id===id);
function catQ(c,k){const h=+k.split('-')[2],m=+c.mensual||0;if(c.cuando==='q1')return h===1?m:0;if(c.cuando==='q2')return h===2?m:0;return m/2}
const salidasCats=()=>cfg.categorias.filter(c=>c.tipo!=='ingreso');
const presQ=k=>salidasCats().reduce((t,c)=>t+catQ(c,k),0);
function colorOf(c){const i=cfg.categorias.indexOf(c);return 'var(--c'+((i>=0?i:0)%6+1)+')'}
const fondoActual=()=>(+cfg.fondoInicial||0)+sum(movs.filter(m=>m.tipo==='ahorro'));
const salCat=()=>cfg&&cfg.categorias.find(c=>c.clave==='salario');
function deudaPagado(d){return (+d.pagadoInicial||0)+sum(movs.filter(m=>{const c=catById(m.cat);return c&&c.deudaId===d.id&&m.tipo==='gasto'}))}

function render(){
  if(view.contains(document.activeElement)&&document.activeElement.matches('input,select')){pending=true;return}
  pending=false;
  document.querySelectorAll('.tabbar [data-view]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.view===curView)));
  if(!sb){return}
  if(!user){if(!entered)renderAuth();return}
  if(!loaded)return;
  aplicarAspecto();asegurarAvatar();pintarTabPerfil();
  if(cfg){const mo=cfg.modoQuincena||'calendario';try{localStorage.setItem('misquincenas.modo',mo)}catch(e){}if(mo!==render.modo){if(render.modo!==undefined||curQ!==qKey(today()))curQ=qKey(today());render.modo=mo}}
  if(!cfg){const loc=datosLocales();view.innerHTML=`<div class="empty"><h2>Tu cuenta está lista</h2><p>Aún no tiene datos. Elige cómo empezar. Si eliges “desde cero”, tú mismo armas tu sueldo y tu presupuesto en Perfil.</p><p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${loc?'<button class="btn primary" data-act="subirlocal">Subir los datos de este dispositivo</button>':''}<button class="btn ${loc?'':'primary'}" data-act="importar">Restaurar una copia</button><button class="btn" data-act="initcfg">Empezar desde cero</button></p></div>`;return}
  view.innerHTML=({inicio:vInicio,movs:vMovs,metas:vResumen,ajustes:vAjustes}[curView])();
}

function qHeader(){const Q=qInfo(curQ),dl=Q.daysLeft();
  return `<div class="top"><div><div class="label">${esc(Q.range)}${dl?` · quedan ${dl} día${dl===1?'':'s'}`:''}</div><h1>${esc(Q.name)}</h1></div>
  <div class="qpick"><button class="iconbtn" data-act="prevq" aria-label="Quincena anterior">‹</button><button class="iconbtn" data-act="nextq" aria-label="Quincena siguiente">›</button></div></div>
  ${curQ!==qKey(today())?`<div><button class="pill" data-act="hoyq">Ir a la quincena actual</button></div>`:''}`}

function pendientes(k){
  const qm=movs.filter(m=>qKey(m.fecha)===k);const out=[];
  const sal=salCat();if(sal){const got=sum(qm.filter(m=>m.cat===sal.id));out.push({c:sal,meta:netoQ(),hecho:got,txt:'Recibir mi sueldo',accion:'Lo recibí'})}
  salidasCats().filter(c=>c.fijo).forEach(c=>{const meta=catQ(c,k);if(meta<=0)return;const hecho=sum(qm.filter(m=>m.cat===c.id));
    out.push({c,meta,hecho,txt:(c.tipo==='ahorro'?'Ahorrar para ':'Pagar ')+c.nombre.toLowerCase().replace(/^ahorro (para )?/,''),accion:c.tipo==='ahorro'?'Ya ahorré':'Ya pagué'})});
  return out}

function vInicio(){
  const qm=movs.filter(m=>qKey(m.fecha)===curQ);
  const ing=sum(qm.filter(m=>m.tipo==='ingreso')),gas=sum(qm.filter(m=>m.tipo==='gasto')),aho=sum(qm.filter(m=>m.tipo==='ahorro'));
  const pend=pendientes(curQ);
  const salPend=pend.find(p=>p.c.clave==='salario');const esperado=salPend&&salPend.hecho<salPend.meta?salPend.meta-salPend.hecho:0;
  const facturas=cfg.categorias.filter(c=>c.tipo==='gasto'&&!c.fijo&&c.enRitmo===false).reduce((t,c)=>t+Math.max(catQ(c,curQ)-sum(qm.filter(m=>m.cat===c.id)),0),0);
  const porPagar=pend.filter(p=>p.c.clave!=='salario').reduce((t,p)=>t+Math.max(p.meta-p.hecho,0),0)+facturas;
  const hoyQ=qKey(today()),futura=curQ>hoyQ,inicioQ=fechaCorta(qBounds(curQ).start);
  const prev=movs.filter(m=>qKey(m.fecha)<curQ);
  const venia=sum(prev.filter(m=>m.tipo==='ingreso'))-sum(prev.filter(m=>m.tipo==='gasto'))-sum(prev.filter(m=>m.tipo==='ahorro'));
  const libre=venia+ing-gas-aho-porPagar;
  const planPagos=porPagar,sueldoEsp=netoQ();
  const done=pend.filter(p=>p.hecho>=p.meta-1).length;
  const todos=pend.map(p=>{const ok=p.hecho>=p.meta-1;const falta=p.meta-p.hecho;
    return `<div class="todo ${ok?'done':''}"><span class="check" aria-hidden="true">✓</span><div style="min-width:0"><div class="tn">${esc(p.txt)}</div>
    <div class="small muted num">${ok?fmt(p.hecho):(p.hecho>0?`${fmt(p.hecho)} de ${fmt(p.meta)}`:fmt(p.meta))}</div></div>
    ${ok?'<span class="tag good">Listo</span>':futura?`<span class="tag info">Desde el ${inicioQ}</span>`:`<button class="btn soft" data-act="cumplir" data-cat="${esc(p.c.id)}" data-monto="${Math.round(falta)}">${esc(p.accion)}</button>`}</div>`}).join('');
  const vars=cfg.categorias.filter(c=>c.tipo==='gasto'&&!c.fijo).map(c=>{const p=catQ(c,curQ),r=sum(qm.filter(m=>m.cat===c.id));return{c,p,r}}).filter(x=>x.p>0||x.r>0);
  const bars=vars.map(({c,p,r})=>{const pct=p?r/p*100:100,cls=pct>100?'over':pct>85?'warn':'';
    const tag=p===0?'<span class="tag bad">sin presupuesto</span>':pct>100?`<span class="tag bad">te pasaste ${fmt(r-p)}</span>`:`<span class="tag ${pct>85?'warn':'good'}">te quedan ${fmt(p-r)}</span>`;
    return `<div class="brow"><div class="n"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.nombre)}</div><div class="r num">${fmt(r)} <span class="muted">/ ${fmt(p)}</span></div>
    <div class="bar"><i class="${cls}" style="width:${Math.min(pct,100)}%"></i></div><div>${tag}</div></div>`}).join('');
  const chips=cfg.categorias.filter(c=>c.tipo==='gasto'&&!c.fijo).map(c=>`<button class="chip-btn" data-act="quick" data-cat="${esc(c.id)}"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.nombre)}</button>`).join('');
  return `<section><div class="hello"><button data-act="irperfil" aria-label="Ir a mi perfil">${avatarHtml(46)}</button><div style="min-width:0"><b>${saludo()}${primerNombre()?', '+esc(primerNombre()):''}</b>${cfg.frase?`<span class="small muted">${esc(cfg.frase)}</span>`:''}</div></div>
  ${qHeader()}
  ${futura?`<div class="hero plan"><span class="label">Quincena planeada</span><span class="big" style="font-size:1.7rem">Empieza el ${inicioQ}</span>
    <p>Todavía no hay plata disponible aquí. El ${inicioQ} se suma lo que te sobre de la quincena anterior, y tu sueldo cuando lo marques como recibido.</p>
    <div class="trio"><div><span>Sueldo esperado</span><b>${fmtK(sueldoEsp)}</b></div><div><span>Pagos y ahorro</span><b>${fmtK(planPagos)}</b></div><div><span>Sobraría</span><b>${fmtK(sueldoEsp-planPagos)}</b></div></div></div>`
  :`<div class="hero ${libre<0&&!(esperado&&curQ===hoyQ)?'neg':''}"><span class="label">Libre para gastar</span><span class="big">${fmt(libre)}</span>
    <p>${esperado&&curQ===hoyQ?'Solo cuenta plata real: tu sueldo de esta quincena se suma cuando lo marques como recibido.':libre<0?'No alcanza para lo que falta pagar. Revisa tus gastos o pagos pendientes.':'Ya descontamos lo que te falta pagar y ahorrar.'}</p>
    <div class="trio four"><div><span>Venía</span><b>${fmtK(venia)}</b></div><div><span>Entró</span><b>${fmtK(ing)}</b></div><div><span>Gastaste</span><b>${fmtK(gas)}</b></div><div><span>Ahorraste</span><b>${fmtK(aho)}</b></div></div></div>`}
  ${pend.length?`<div class="card"><div class="row"><h2>Pendientes</h2><span class="small muted">${done} de ${pend.length} listos</span></div><div>${todos}</div></div>`:''}
  ${chips&&!futura?`<div class="card"><h2>Anotar un gasto rápido</h2><div class="chips">${chips}</div></div>`:''}
  ${bars?`<div class="card"><h2>¿Cómo vas con tu presupuesto?</h2><div>${bars}</div></div>`:''}
  </section>`}

function vMovs(){
  if(filtro==='papelera')return vPapelera();
  const qm=movs.filter(m=>qKey(m.fecha)===curQ&&(filtro==='todos'||m.tipo===filtro)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||String(b.creado||'').localeCompare(String(a.creado||'')));
  let html='',last='';
  qm.forEach(m=>{if(m.fecha!==last){if(last)html+='</div>';last=m.fecha;const d=new Date(m.fecha+'T12:00');html+=`<div class="day">${m.fecha===today()?'Hoy':DIA[d.getDay()]+' '+d.getDate()}</div><div>`}
    const c=catById(m.cat);const n=c?c.nombre:'Sin categoría';
    html+=`<button class="mov" data-act="edit" data-id="${esc(m.id)}"><span class="avatar" style="background:${c?colorOf(c):'var(--muted)'}">${esc(n.charAt(0).toUpperCase())}</span>
    <span style="min-width:0"><b>${esc(m.nota||n)}</b><span class="s">${esc(m.nota?n:({gasto:'Gasto',ingreso:'Ingreso',ahorro:'Ahorro'}[m.tipo]))}</span></span>
    <span class="amt ${m.tipo==='ingreso'?'pos':''}">${m.tipo==='ingreso'?'+':'−'}${fmt(m.monto)}</span></button>`});
  if(last)html+='</div>';
  const F=[['todos','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['ahorro','Ahorro'],['papelera','Papelera']].map(([k,t])=>`<button data-act="filtro" data-f="${k}" aria-pressed="${filtro===k}">${t}</button>`).join('');
  return `<section>${qHeader()}<div class="filters">${F}</div>
  <div class="card">${html||`<div class="empty" style="padding:24px 8px"><h2>Nada por aquí</h2><p>Toca el botón + para anotar tu primer movimiento de esta quincena.</p></div>`}</div>
  ${html?'<p class="small muted" style="text-align:center">Toca un movimiento para editarlo o borrarlo. Lo que borres va a la papelera.</p>':''}</section>`}
function vPapelera(){
  const F=[['todos','Todos'],['gasto','Gastos'],['ingreso','Ingresos'],['ahorro','Ahorro'],['papelera','Papelera']].map(([k,t])=>`<button data-act="filtro" data-f="${k}" aria-pressed="${filtro===k}">${t}</button>`).join('');
  const rows=srv.papelera.map(r=>{const c=catById(r.categoria_id);const n=c?c.nombre:'Categoría borrada';const d=new Date(r.fecha+'T12:00');
    return `<div class="mov" style="cursor:default"><span class="avatar" style="background:${c?colorOf(c):'var(--muted)'};opacity:.6">${esc(n.charAt(0).toUpperCase())}</span>
    <span style="min-width:0"><b>${esc(n)} · <span class="amt">${fmt(r.monto)}</span></b><span class="s">${d.getDate()} ${MES[d.getMonth()]}${r.nota?' · '+esc(r.nota):''}</span></span>
    <button class="btn soft" data-act="recuperar" data-id="${esc(r.id)}">Recuperar</button></div>`}).join('');
  return `<section><div><div class="label">Nada se pierde</div><h1>Papelera</h1></div><div class="filters">${F}</div>
  <div class="card">${rows||'<div class="empty" style="padding:24px 8px"><h2>La papelera está vacía</h2><p>Cuando borres un movimiento aparecerá aquí y lo podrás recuperar.</p></div>'}</div>
  <p class="small muted" style="text-align:center">La base de datos además guarda el historial de cada cambio que haces.</p></section>`}

function vMetas(){
  const meta=+cfg.metaFondo||0,f=fondoActual(),pf=meta?Math.min(f/meta*100,100):0;
  const ahoMes=cfg.categorias.filter(c=>c.tipo==='ahorro').reduce((t,c)=>t+(+c.mensual||0),0);
  const mesesF=ahoMes>0&&f<meta?Math.ceil((meta-f)/ahoMes):null;
  const eta=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return MES[d.getMonth()]+' '+d.getFullYear()};
  const deudas=cfg.deudas.map(d=>{const pag=deudaPagado(d),rest=Math.max((+d.total||0)-pag,0),p=d.total?Math.min(pag/d.total*100,100):0;
    const pagoMes=cfg.categorias.filter(c=>c.deudaId===d.id).reduce((t,c)=>t+(+c.mensual||0),0);const meses=pagoMes>0&&rest>0?Math.ceil(rest/pagoMes):null;
    return `<div class="card"><div class="row"><h2>${esc(d.nombre)}</h2>${rest===0?'<span class="tag good">Pagada</span>':`<span class="tag warn">Faltan ${fmt(rest)}</span>`}</div>
    <div class="progress"><i class="${rest===0?'good':''}" style="width:${p}%"></i></div>
    <div class="kv"><div><span class="small muted">Pagado</span><b>${fmt(pag)}</b></div><div><span class="small muted">Total</span><b>${fmt(d.total)}</b></div>
    <div><span class="small muted">Terminas en</span><b>${rest===0?'¡Listo!':meses?eta(meses):'Abona cuando puedas'}</b></div></div>${d.nota?`<p class="small muted" style="margin:0">${esc(d.nota)}</p>`:''}${rest>0?`<button class="btn primary" data-act="abonar" data-id="${esc(d.id)}">Registrar abono</button>`:''}</div>`}).join('');
  const nq=netoQ();let acc=fondoActual();const rows=[];
  for(let i=0;i<12;i++){const k=qShift(qKey(today()),i);const p=presQ(k);const ah=salidasCats().filter(c=>c.tipo==='ahorro').reduce((t,c)=>t+catQ(c,k),0);acc+=ah;const sob=nq-p;
    rows.push(`<tr><td>${esc(qInfo(k).short)}</td><td class="num">${fmt(nq)}</td><td class="num">${fmt(p)}</td><td class="num ${sob<0?'neg':''}">${fmt(sob)}</td><td class="num">${fmt(acc)}</td></tr>`)}
  return `<section><div><div class="label">Lo que estás construyendo</div><h1>Tus metas</h1></div>
  <div class="card"><div class="row"><h2>Fondo de emergencia</h2>${pf>=100?'<span class="tag good">Meta cumplida</span>':`<span class="tag info">${Math.round(pf)}%</span>`}</div>
    <div class="progress"><i class="${pf>=100?'good':''}" style="width:${pf}%"></i></div>
    <div class="kv"><div><span class="small muted">Ahorrado</span><b>${fmt(f)}</b></div><div><span class="small muted">Meta</span><b>${fmt(meta)}</b></div>
    <div><span class="small muted">Llegas en</span><b>${pf>=100?'¡Ya!':mesesF?eta(mesesF):'Define un ahorro'}</b></div></div>
    <p class="small muted" style="margin:0">Cada vez que registras un movimiento de tipo “Ahorro”, suma aquí. Es tu colchón para imprevistos, no para gustos.</p></div>
  ${deudas}
  <div class="card"><h2>Si sigues tu plan</h2>
    <details><summary>Ver las próximas 12 quincenas</summary><div class="tbl" style="margin-top:10px"><table>
    <thead><tr><th>Quincena</th><th>Sueldo neto</th><th>Plan</th><th>Sobra</th><th>Fondo</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="small muted">“Plan” suma todo lo presupuestado (gastos, pagos y ahorro). “Sobra” es lo que queda sin asignar.</p></details></div>
  </section>`}

function vAjustes(){
  const debtOpts=sel=>`<option value="">Ninguna</option>`+cfg.deudas.map(d=>`<option value="${esc(d.id)}" ${sel===d.id?'selected':''}>${esc(d.nombre)}</option>`).join('');
  const nq=netoQ(),mesPlan=salidasCats().reduce((t,c)=>t+(+c.mensual||0),0),mesNeto=nq*2,sobra=mesNeto-mesPlan;
  const cats=cfg.categorias.map((c,i)=>c.clave==='salario'?'':`<div class="erow">
    <div class="grid2"><div class="field"><label for="kn${i}">Nombre</label><input id="kn${i}" data-bind="categorias.${i}.nombre" value="${esc(c.nombre)}"></div>
    <div class="field"><label for="km${i}">${c.tipo==='ingreso'?'Esperado al mes':'Al mes'}</label><input id="km${i}" class="num" inputmode="numeric" data-bind="categorias.${i}.mensual" data-money value="${fmt(c.mensual)}"></div></div>
    <div class="opts"><label>Tipo <select id="kt${i}" data-bind="categorias.${i}.tipo"><option value="gasto" ${c.tipo==='gasto'?'selected':''}>Gasto</option><option value="ahorro" ${c.tipo==='ahorro'?'selected':''}>Ahorro</option><option value="ingreso" ${c.tipo==='ingreso'?'selected':''}>Ingreso</option></select></label>

/* Edición de ajustes */
function setPath(o,p,v){p=p.split('.');for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v}
view.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.bind||!cfg)return;
  let v=t.type==='checkbox'?t.checked:t.value;
  if('money' in t.dataset)v=parseMoney(v);else if('number' in t.dataset)v=Number(String(v).replace(',','.'))||0;
  setPath(cfg,t.dataset.bind,v);if('money' in t.dataset)t.value=fmt(v);saveCfg();toast('Guardado');
  if(t.tagName==='SELECT'||t.type==='checkbox'){t.blur();setTimeout(render,0)}});
view.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!(view.contains(document.activeElement)&&document.activeElement.matches('input,select')))render()},0));

/* Navegación y acciones */

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!view.contains(b))return;const a=b.dataset.act,i=+b.dataset.i;
  if(a==='prevq'){curQ=qShift(curQ,-1);render()}
  else if(a==='nextq'){curQ=qShift(curQ,1);render()}

  else if(a==='filtro'){filtro=b.dataset.f;render()}
  else if(a==='quick')openSheet({tipo:'gasto',cat:b.dataset.cat});
  else if(a==='edit'){const m=movs.find(x=>x.id===b.dataset.id);if(m)openSheet(m)}
  else if(a==='cumplir'){const c=catById(b.dataset.cat);if(!c)return;const tipo=c.tipo,monto=+b.dataset.monto;
    db.collection('movs').add({fecha:qInfo(curQ).dateIn(),tipo,cat:c.id,monto,nota:'',creado:new Date().toISOString()})
      .then(r=>toast((tipo==='ingreso'?'Sueldo registrado: ':tipo==='ahorro'?'Ahorro registrado: ':'Pago registrado: ')+fmt(monto),()=>r.delete()))
      .catch(()=>toast('No se pudo guardar. Intenta de nuevo.'))}
  else if(a==='addcat'){cfg.categorias.push({id:newId(),nombre:'Nueva categoría',tipo:'gasto',mensual:0,cuando:'ambas',fijo:false,deudaId:''});saveCfg();render()}
  else if(a==='delcat'){const old=JSON.parse(JSON.stringify(cfg));cfg.categorias.splice(i,1);saveCfg();render();toast('Categoría quitada',()=>{cfg=old;saveCfg();render()})}
  else if(a==='adddeuda'){cfg.deudas.push({id:newId(),nombre:'Nueva deuda',total:0,pagadoInicial:0,nota:''});saveCfg();render()}
  else if(a==='deldeuda'){const old=JSON.parse(JSON.stringify(cfg));const id=cfg.deudas[i].id;cfg.deudas.splice(i,1);cfg.categorias.forEach(c=>{if(c.deudaId===id)c.deudaId=''});saveCfg();render();toast('Deuda quitada',()=>{cfg=old;saveCfg();render()})}
  else if(a==='initcfg'){const pf=srv.perfil||{};cfg={modoQuincena:pf.modo_quincena||'pago_15_30',nombre:pf.nombre||'',frase:pf.frase||'',color:pf.color_acento||'azul',tema:pf.tema||'auto',avatarPath:pf.avatar_path||null,
    salario:0,ssPct:8,otrosIngresos:0,metaFondo:0,fondoInicial:0,deudas:[],categorias:[{id:newId(),clave:'salario',nombre:'Salario',tipo:'ingreso',mensual:0},{id:newId(),nombre:'Fondo de emergencia',tipo:'ahorro',mensual:0,cuando:'ambas',fijo:true}]};saveCfg();curView='ajustes';render();toast('Listo. Arma tu presupuesto aquí: agrega tus categorías y montos.')}
});

/* Hoja de registro */
function openSheet(m){
  sheet={tipo:m&&m.tipo||'gasto',cat:m&&m.cat||'',editId:m&&m.id||null,nueva:false};
  $('#sheetTitle').textContent=sheet.editId?'Editar movimiento':'Nuevo movimiento';
  $('#fMonto').value=m&&m.monto?fmt(m.monto):'';$('#fNota').value=m&&m.nota||'';
  $('#fFecha').value=m&&m.fecha||qInfo(curQ).dateIn();$('#fErr').hidden=true;
  $('#delBtn').hidden=!sheet.editId;$('#delBtn').textContent='Borrar este movimiento';$('#delBtn').dataset.armed='';
  $('#saveBtn').textContent=sheet.editId?'Guardar cambios':'Guardar';
  paintSheet();$('#sheet').hidden=false;if(!(m&&m.cat)||!sheet.editId)setTimeout(()=>$('#fMonto').focus(),60)}
function closeSheet(){$('#sheet').hidden=true;if(pending)render()}
function paintSheet(){
  document.querySelectorAll('#movForm .seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tipo===sheet.tipo)));
  const cats=cfg.categorias.filter(c=>c.tipo===sheet.tipo&&!(c.deudaId&&!c.fijo&&c.id!==sheet.cat&&/^Abono a /.test(c.nombre)));
  if(!cats.find(c=>c.id===sheet.cat))sheet.cat=cats[0]?cats[0].id:'';
  $('#catgrid').innerHTML=cats.map(c=>`<button type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id===sheet.cat}"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.nombre)}</button>`).join('')||'<span class="small muted">Aún no tienes categorías de este tipo.</span>';
  $('#catgrid').insertAdjacentHTML('beforeend',sheet.nueva?`<div class="nuevacat"><input id="fNuevaCat" maxlength="60" autocomplete="off" placeholder="${{gasto:'Ej: Netflix, regalo, médico',ingreso:'Ej: freelance, venta, prima',ahorro:'Ej: viaje, moto, navidad'}[sheet.tipo]}" aria-label="Nombre de la nueva categoría"><button type="button" class="btn primary" id="okNueva">Agregar</button><button type="button" class="btn" id="noNueva" aria-label="Cancelar">✕</button></div>`:'<button type="button" class="otra" data-nueva="1">+ Otra</button>');
  const q=sheet.tipo==='gasto'?[5000,10000,20000,50000,100000]:sheet.tipo==='ahorro'?[50000,100000,200000,500000]:[netoQ()];
  $('#quick').innerHTML=q.map(n=>`<button type="button" data-q="${Math.round(n)}">${sheet.tipo==='ingreso'?'Mi quincena '+fmtK(n):'+'+fmtK(n)}</button>`).join('');pintarDeudas()}
document.querySelectorAll('#movForm .seg button').forEach(b=>b.addEventListener('click',()=>{sheet.tipo=b.dataset.tipo;sheet.nueva=false;paintSheet()}));
$('#catgrid').addEventListener('click',e=>{
  if(e.target.closest('[data-nueva]')){sheet.nueva=true;paintSheet();setTimeout(()=>$('#fNuevaCat')&&$('#fNuevaCat').focus(),30);return}
  if(e.target.closest('#okNueva')){crearCatRapida();return}
  if(e.target.closest('#noNueva')){sheet.nueva=false;paintSheet();return}
  const b=e.target.closest('[data-cat]');if(!b)return;sheet.cat=b.dataset.cat;paintSheet()});
$('#catgrid').addEventListener('keydown',e=>{if(e.target.id==='fNuevaCat'&&e.key==='Enter'){e.preventDefault();crearCatRapida()}});
function crearCatRapida(){const i=$('#fNuevaCat');const nombre=(i&&i.value||'').trim().replace(/\s+/g,' ').slice(0,60);
  if(!nombre){i&&i.focus();return false}
  const ya=cfg.categorias.find(c=>c.tipo===sheet.tipo&&c.nombre.toLowerCase()===nombre.toLowerCase());
  if(ya){sheet.cat=ya.id}else{const c={id:newId(),nombre:nombre.charAt(0).toUpperCase()+nombre.slice(1),tipo:sheet.tipo,mensual:0,cuando:'ambas',fijo:false,enRitmo:true,deudaId:''};
    cfg.categorias.push(c);saveCfg();sheet.cat=c.id;toast('Categoría “'+c.nombre+'” creada')}
  sheet.nueva=false;paintSheet();return true}
$('#quick').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const n=+b.dataset.q;
  $('#fMonto').value=fmt(sheet.tipo==='ingreso'?n:parseMoney($('#fMonto').value)+n)});
$('#plus').addEventListener('click',()=>{if(cfg)openSheet(null)});
$('#closeSheet').addEventListener('click',closeSheet);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
$('#fMonto').addEventListener('input',e=>{const n=parseMoney(e.target.value);e.target.value=n?fmt(n):''});
$('#delBtn').addEventListener('click',()=>{const b=$('#delBtn');
  if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Toca otra vez para borrar';return}
  const m=movs.find(x=>x.id===sheet.editId);if(!m)return;const copy=Object.assign({},m);delete copy.id;
  db.doc('movs/'+m.id).delete().then(()=>{closeSheet();toast('Enviado a la papelera',()=>db.doc('movs/'+m.id).set(copy))}).catch(()=>toast('No se pudo borrar.'))});
$('#movForm').addEventListener('submit',async e=>{e.preventDefault();
  const monto=parseMoney($('#fMonto').value),fecha=$('#fFecha').value,err=$('#fErr');
  if(!monto){err.textContent='Escribe cuánto fue.';err.hidden=false;$('#fMonto').focus();return}
  if(sheet.nueva&&$('#fNuevaCat')&&$('#fNuevaCat').value.trim())crearCatRapida();
  if(!sheet.cat){err.textContent='Elige en qué fue.';err.hidden=false;return}
  if(!fecha){err.textContent='Elige una fecha.';err.hidden=false;return}
  const data={fecha,tipo:sheet.tipo,cat:sheet.cat,monto,nota:$('#fNota').value.trim().slice(0,120)};
  await saving;
  try{if(sheet.editId){const old=movs.find(x=>x.id===sheet.editId);data.creado=old&&old.creado||new Date().toISOString();await db.doc('movs/'+sheet.editId).set(data);toast('Cambios guardados')}
    else{data.creado=new Date().toISOString();const r=await db.collection('movs').add(data);toast((sheet.tipo==='gasto'?'Gasto':sheet.tipo==='ahorro'?'Ahorro':'Ingreso')+' guardado: '+fmt(monto),()=>r.delete())}
    curQ=qKey(fecha);closeSheet();render()}
  catch(x){err.textContent=x&&x.code==='quota_exceeded'?'Tu libreta está llena. Borra movimientos viejos.':'No se guardó. Revisa tu conexión e intenta de nuevo.';err.hidden=false}});

const CONF=window.MQ_CONFIG||{};
let sb=null,user=null,authView='login',authMsg='',entered=false,channel=null;
const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));
const subs={config:[],movs:[]};
let srv={perfil:null,categorias:[],deudas:[],metas:[],movs:[],papelera:[]};
let srvEstado={deudas:{},metas:{}};

const fondoMeta=()=>srv.metas.find(m=>m.tipo==='fondo_emergencia');
function buildCfg(){const p=srv.perfil;if(!p||!p.configurado)return null;const f=fondoMeta();
  return{modoQuincena:p.modo_quincena||'calendario',nombre:p.nombre||'',frase:p.frase||'',color:p.color_acento||'azul',tema:p.tema||'auto',avatarPath:p.avatar_path||null,salario:+p.salario_mensual,ssPct:+p.pct_seguridad_social,otrosIngresos:+p.otros_ingresos_mensual,
    metaFondo:f?+f.monto_objetivo:0,fondoInicial:f?+f.ahorrado_inicial:0,fondoId:f?f.id:null,
    categorias:srv.categorias.slice().sort((a,b)=>a.orden-b.orden).map(c=>({id:c.id,nombre:c.nombre,tipo:c.tipo,clave:c.clave||null,mensual:+c.presupuesto_mensual,cuando:c.cuando,fijo:c.fijo,enRitmo:c.en_ritmo!==false,deudaId:c.deuda_id||''})),
    deudas:srv.deudas.map(d=>({id:d.id,nombre:d.nombre,total:+d.monto_total,pagadoInicial:+d.pagado_inicial,nota:d.nota}))}}
const rowToMov=r=>({fecha:r.fecha,tipo:r.tipo,cat:r.categoria_id,monto:+r.monto,nota:r.nota||'',creado:r.creado_en});
function emitConfig(){const c=buildCfg();subs.config.forEach(f=>f({exists:!!c,data:()=>c,metadata:{fromCache:false}}))}
function emitMovs(){const docs=srv.movs.map(r=>({id:r.id,exists:true,data:()=>rowToMov(r)}));subs.movs.forEach(f=>f({docs}))}
const ok=({data,error})=>{if(error)throw error;return data};
async function refreshAll(){const u=user.id;
  const[perfil,cats,deus,mets,mv,pap,de,me]=await Promise.all([
    sb.from('perfiles').select('*').eq('user_id',u).maybeSingle().then(ok),
    sb.from('categorias').select('*').eq('user_id',u).is('borrado_en',null).then(ok),
    sb.from('deudas').select('*').eq('user_id',u).is('borrado_en',null).then(ok),
    sb.from('metas').select('*').eq('user_id',u).is('borrado_en',null).then(ok),
    sb.from('movimientos').select('*').eq('user_id',u).is('borrado_en',null).order('fecha',{ascending:false}).limit(5000).then(ok),
    sb.from('movimientos').select('*').eq('user_id',u).not('borrado_en','is',null).order('borrado_en',{ascending:false}).limit(100).then(ok),
    sb.from('v_deudas_estado').select('*').then(ok),
    sb.from('v_metas_estado').select('*').then(ok)]);
  srv={perfil,categorias:cats||[],deudas:deus||[],metas:mets||[],movs:mv||[],papelera:pap||[]};
  srvEstado={deudas:Object.fromEntries((de||[]).map(x=>[x.id,x])),metas:Object.fromEntries((me||[]).map(x=>[x.id,x]))};
  saveCache();emitMovs();emitConfig()}
let refreshT=null;function refreshSoon(){clearTimeout(refreshT);refreshT=setTimeout(()=>{if(user)refreshAll().catch(()=>{})},350)}

async function guardarConfig(d){const u=user.id,now=new Date().toISOString();

  const s=Math.min(img.naturalWidth,img.naturalHeight),N=320,cv=document.createElement('canvas');cv.width=cv.height=N;

  return await new Promise(ok=>cv.toBlob(ok,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}

const mesLabel=k=>{const[y,m]=k.split('-').map(Number);return MES[m-1]+' '+y};
const corto=n=>{n=Math.round(n||0);const a=Math.abs(n);return a>=1e6?'$'+(n/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+'M':a>=1e3?'$'+Math.round(n/1e3)+'k':'$'+n};
function nice(max){if(max<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(max)));const f=max/e;return([1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>x>=f))*e}
function vResumen(){const seg=[['graf','Gráficas'],['metas','Metas']].map(([k,t])=>`<button type="button" data-act="restab" data-t="${k}" aria-pressed="${resTab===k}">${t}</button>`).join('');
  return `<div class="seg two" style="margin-bottom:18px">${seg}</div>`+(resTab==='graf'?vGraficas():vMetas())}

function vGraficas(){
  const mm=movs.filter(m=>m.fecha.slice(0,7)===curMes);
  const ing=sum(mm.filter(m=>m.tipo==='ingreso')),gas=sum(mm.filter(m=>m.tipo==='gasto')),aho=sum(mm.filter(m=>m.tipo==='ahorro'));
  /* A. En qué se va tu plata */
  const filas=cfg.categorias.filter(c=>c.tipo==='gasto').map(c=>({c,real:sum(mm.filter(m=>m.cat===c.id)),pres:+c.mensual||0})).filter(x=>x.real>0||x.pres>0).sort((a,b)=>b.real-a.real||b.pres-a.pres);
  const sinCat=sum(mm.filter(m=>m.tipo==='gasto'&&!catById(m.cat)));if(sinCat)filas.push({c:{nombre:'Sin categoría'},real:sinCat,pres:0});
  const mx=Math.max(1,...filas.map(x=>Math.max(x.real,x.pres)));
  const barras=filas.map(x=>{const w=x.real/mx*100,pw=x.pres/mx*100,over=x.pres>0&&x.real>x.pres;const okW=over?pw:w;
    return `<div class="hb" tabindex="0" title="${esc(x.c.nombre)}: ${fmt(x.real)} de ${fmt(x.pres)}">
      <div class="hb-top"><span class="hb-n">${esc(x.c.nombre)}</span><span class="num small"><b>${fmt(x.real)}</b>${x.pres?` <span class="muted">de ${fmt(x.pres)}</span>`:''}</span></div>
      <div class="hb-track"><i style="width:${okW}%"></i>${over?`<i class="over" style="left:calc(${pw}% + 2px);width:calc(${w-pw}% - 2px)"></i>`:''}${x.pres?`<span class="hb-mark" style="left:${pw}%"></span>`:''}</div>
      ${over?`<span class="tag bad">Te pasaste ${fmt(x.real-x.pres)}</span>`:x.pres&&x.real===0?'<span class="small muted">Aún nada este mes</span>':''}</div>`}).join('');
  /* B. Mes a mes (6 meses) */
  const meses=[];for(let i=5;i>=0;i--)meses.push(mesShift(curMes,-i));
  const datos=meses.map(k=>{const r=movs.filter(m=>m.fecha.slice(0,7)===k);return{k,g:sum(r.filter(m=>m.tipo==='gasto')),a:sum(r.filter(m=>m.tipo==='ahorro')),i:sum(r.filter(m=>m.tipo==='ingreso'))}});
  const W=340,H=190,L=44,R=8,T=10,B=26,pw_=W-L-R,ph=H-T-B;const top=nice(Math.max(1,...datos.map(d=>Math.max(d.g,d.a,d.i))));
  const y=v=>T+ph-(v/top*ph),slot=pw_/datos.length,bw=Math.min(18,slot*0.3);
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Ingresos, gastos y ahorro de los últimos 6 meses"><defs><pattern id="rayas" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--accent-soft)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--accent)" stroke-width="2"/></pattern></defs>`;
  for(let j=0;j<=4;j++){const v=top*j/4,yy=y(v);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+3.5}" text-anchor="end" class="ax">${corto(v)}</text>`}
  const pts=[];
  datos.forEach((d,i)=>{const cx=L+slot*i+slot/2;pts.push([cx,y(d.i)]);
    const bar=(x,v,fill,tip)=>v>0?`<path d="M${x},${y(0)} V${y(v)+Math.min(4,(y(0)-y(v)))} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${y(0)} Z" fill="${fill}" class="mk" data-tip="${tip}"/>`:'';
    svg+=bar(cx-bw-1,d.g,'var(--accent)',`${mesLabel(d.k)} · Gastos ${fmt(d.g)}`)+bar(cx+1,d.a,'url(#rayas)',`${mesLabel(d.k)} · Ahorro ${fmt(d.a)}`);
    svg+=`<rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${ph}" fill="transparent" class="hit" data-tip="${mesLabel(d.k)}: entró ${fmt(d.i)} · gastaste ${fmt(d.g)} · ahorraste ${fmt(d.a)}"/>`;
    svg+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="ax${d.k===curMes?' ax-on':''}">${MES[+d.k.slice(5)-1].slice(0,3)}</text>`});
  svg+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3" pointer-events="none"/>`;
  pts.forEach((p,i)=>{if(datos[i].i>0)svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>`});
  svg+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg>`;
  const tabla=`<table><thead><tr><th>Mes</th><th>Entró</th><th>Gastos</th><th>Ahorro</th></tr></thead><tbody>${datos.map(d=>`<tr><td>${mesLabel(d.k)}</td><td class="num">${fmt(d.i)}</td><td class="num">${fmt(d.g)}</td><td class="num">${fmt(d.a)}</td></tr>`).join('')}</tbody></table>`;
  /* C. Ritmo de gasto de la quincena */
  const qk=qKey(today()),QB=qBounds(qk),dias=diasEntre(QB.start,QB.end),d0=0,d1=dias.length-1,hoy=Math.max(0,dias.indexOf(today()));
  const varCats=cfg.categorias.filter(c=>c.tipo==='gasto'&&!c.fijo&&c.enRitmo!==false),varIds=new Set(varCats.map(c=>c.id));
  const presVar=varCats.reduce((t,c)=>t+catQ(c,qk),0);
  const qmv=movs.filter(m=>qKey(m.fecha)===qk&&m.tipo==='gasto'&&varIds.has(m.cat));
  const acum=[];let run=0;for(let d=d0;d<=Math.min(hoy,d1);d++){run+=sum(qmv.filter(m=>m.fecha===dias[d]));acum.push([d,run])}
  const W2=340,H2=170,L2=44,R2=10,T2=12,B2=24,pw2=W2-L2-R2,ph2=H2-T2-B2,top2=nice(Math.max(presVar,run,1));
  const x2=d=>L2+(d-d0)/Math.max(1,d1-d0)*pw2,y2=v=>T2+ph2-v/top2*ph2;
  let s2=`<svg viewBox="0 0 ${W2} ${H2}" class="chart" role="img" aria-label="Gasto acumulado de la quincena comparado con el ritmo ideal">`;
  for(let j=0;j<=3;j++){const v=top2*j/3;s2+=`<line x1="${L2}" x2="${W2-R2}" y1="${y2(v)}" y2="${y2(v)}" stroke="var(--line)"/><text x="${L2-6}" y="${y2(v)+3.5}" text-anchor="end" class="ax">${corto(v)}</text>`}
  [d0,Math.round((d0+d1)/2),d1].forEach((d,j)=>s2+=`<text x="${x2(d)}" y="${H2-7}" text-anchor="${['start','middle','end'][j]}" class="ax">${fechaCorta(dias[d])}</text>`);
  if(presVar>0)s2+=`<line x1="${x2(d0)}" y1="${y2(0)}" x2="${x2(d1)}" y2="${y2(presVar)}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/><text x="${x2(d1)-4}" y="${y2(presVar)-6}" text-anchor="end" class="ax">Ritmo ideal</text>`;
  if(acum.length){const path=acum.map(([d,v],i)=>(i?'L':'M')+x2(d)+','+y2(v)).join(' ');const last=acum[acum.length-1];
    s2+=`<path d="${path} L${x2(last[0])},${y2(0)} L${x2(d0)},${y2(0)} Z" fill="var(--accent-soft)" opacity=".8"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x2(last[0])}" cy="${y2(last[1])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`}
  s2+=`<line x1="${L2}" x2="${W2-R2}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--muted)"/></svg>`;
  const ideal=presVar*(Math.min(hoy,d1)-d0+1)/(d1-d0+1),dif=run-ideal;
  const ritmoMsg=presVar<=0?'<span class="muted">Define presupuesto en tus gastos variables para ver tu ritmo.</span>':dif>presVar*0.05?`<span class="tag bad">Vas ${fmt(dif)} por encima del ritmo</span>`:dif< -presVar*0.05?`<span class="tag good">Vas ${fmt(-dif)} por debajo del ritmo</span>`:'<span class="tag info">Vas justo al ritmo</span>';
  return `<section>
  <div class="top"><div><div class="label">En qué se va tu plata</div><h1 style="text-transform:none">${esc(mesLabel(curMes).replace(/^./,c=>c.toUpperCase()))}</h1></div>
    <div class="qpick"><button class="iconbtn" data-act="prevm" aria-label="Mes anterior">‹</button><button class="iconbtn" data-act="nextm" aria-label="Mes siguiente">›</button></div></div>
  <div class="kv card" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><span class="small muted">Entró</span><b>${corto(ing)}</b></div><div><span class="small muted">Gastaste</span><b>${corto(gas)}</b></div><div><span class="small muted">Ahorraste</span><b>${corto(aho)}</b></div></div>
  <div class="card"><div class="row"><h2>Gastos por categoría</h2><span class="small muted"><span class="lg-mark"></span> presupuesto</span></div>
    ${barras||'<p class="small muted" style="margin:0">Aún no hay gastos este mes.</p>'}</div>
  <div class="card"><h2>Mes a mes</h2>
    <div class="legend"><span><i class="sq" style="background:var(--accent)"></i>Gastos</span><span><i class="sq" style="background-image:repeating-linear-gradient(45deg,var(--accent) 0 2px,var(--accent-soft) 2px 5px)"></i>Ahorro</span><span><i class="ln"></i>Entró</span></div>
    <div class="chart-wrap">${svg}</div><p class="small muted tip" id="tipB">Toca una columna para ver el detalle.</p>
    <details><summary>Ver como tabla</summary><div class="tbl" style="margin-top:8px">${tabla}</div></details></div>
  <div class="card"><div class="row"><h2>Ritmo de esta quincena</h2>${ritmoMsg}</div>
    <p class="small muted" style="margin:0">Tus gastos del día a día (${esc(varCats.map(c=>c.nombre.toLowerCase()).join(', ')||'ninguno')}) frente a lo que podrías llevar gastado hoy si repartes su presupuesto de ${fmt(presVar)} por igual.</p>
    <div class="chart-wrap">${s2}</div></div>
  </section>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const a=b.dataset.act;
    if(a==='restab'){resTab=b.dataset.t;render();return}if(a==='prevm'){curMes=mesShift(curMes,-1);render();return}if(a==='nextm'){curMes=mesShift(curMes,1);render();return}}
  const t=e.target.closest('[data-tip]');const tip=document.querySelector('#tipB');if(t&&tip){tip.textContent=t.dataset.tip;tip.classList.add('on')}});
document.addEventListener('pointerover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tip=document.querySelector('#tipB');if(t&&tip&&e.pointerType==='mouse'){tip.textContent=t.dataset.tip;tip.classList.add('on')}});

/* Borrar todo (va a la papelera de la base; la app empieza en limpio) */
let borrarPaso=false;
async function borrarTodo(){const u=user.id,now=new Date().toISOString();
  for(const t of ['movimientos','operaciones_inversion','inversiones','categorias','deudas','metas','cuentas'])ok(await sb.from(t).update({borrado_en:now}).eq('user_id',u).is('borrado_en',null));
  ok(await sb.from('perfiles').update({configurado:false,salario_mensual:0,otros_ingresos_mensual:0}).eq('user_id',u));
  try{localStorage.removeItem(cacheKey())}catch(e){}await refreshAll()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='pedirborrar'){borrarPaso=true;render();setTimeout(()=>{const i=document.querySelector('#confBorrar');if(i){i.focus();i.scrollIntoView({block:'center'})}},50)}
  else if(a==='cancelarborrar'){borrarPaso=false;if(document.activeElement)document.activeElement.blur();render()}
  else if(a==='borrartodo'){const i=document.querySelector('#confBorrar');if(!i||i.value.trim().toUpperCase()!=='BORRAR'){toast('Escribe BORRAR para confirmar.');i&&i.focus();return}
    b.disabled=true;b.textContent='Borrando…';i.blur();
    try{await borrarTodo();borrarPaso=false;curView='inicio';curQ=qKey(today());render();toast('Listo, empiezas de cero.')}catch(err){b.disabled=false;b.textContent='Borrar todo';toast('No se pudo borrar. Revisa tu conexión.')}}});

/* Contraseña: cambiarla estando adentro, mostrarla y avisar si el enlace de recuperación venció */
let clavePaso=false;
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ver){const f=document.getElementById(t.dataset.ver);if(f)f.querySelectorAll('input[autocomplete$="password"]').forEach(i=>i.type=t.checked?'text':'password')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='cambiarclave'){clavePaso=true;render();setTimeout(()=>{const i=$('#cActual');if(i){i.focus();i.scrollIntoView({block:'center'})}},50)}
  else if(b.dataset.act==='cancelarclave'){clavePaso=false;if(document.activeElement)document.activeElement.blur();render()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='claveForm')return;e.preventDefault();
  const act=$('#cActual').value,n1=$('#cNueva').value,n2=$('#cNueva2').value,err=$('#cErr'),btn=e.target.querySelector('button[type=submit]');
  const fallo=m=>{err.textContent=m;err.hidden=false};err.hidden=true;
  if(!act)return fallo('Escribe tu contraseña actual.');if(n1.length<6)return fallo('La nueva contraseña debe tener al menos 6 caracteres.');
  if(n1!==n2)return fallo('Las contraseñas nuevas no coinciden.');if(n1===act)return fallo('La nueva contraseña debe ser distinta a la actual.');
  btn.disabled=true;btn.textContent='Guardando…';
  try{const v=await sb.auth.signInWithPassword({email:user.email,password:act});if(v.error){if(/Invalid login/i.test(v.error.message))throw new Error('actual');throw v.error}
    const{error}=await sb.auth.updateUser({password:n1});if(error)throw error;
    clavePaso=false;if(document.activeElement)document.activeElement.blur();render();toast('Contraseña cambiada')}
  catch(x){btn.disabled=false;btn.textContent='Guardar nueva contraseña';fallo(x&&x.message==='actual'?'La contraseña actual no es correcta.':errEs(x).replace(/<[^>]+>/g,''))}});
(()=>{const h=new URLSearchParams((location.hash||'').slice(1)+'&'+(location.search||'').slice(1));const code=h.get('error_code')||h.get('error');
  if(code){authMsg='<span class="neg">'+(/expired/i.test(code+h.get('error_description'))?'El enlace del correo ya venció o ya se usó. Pide uno nuevo con “Olvidé mi contraseña”.':'El enlace del correo no es válido. Pide uno nuevo con “Olvidé mi contraseña”.')+'</span>';
    if(/expired|otp|invalid|denied/i.test(code))authView='olvido';history.replaceState(null,'',location.origin+location.pathname)}})();

/* Abonos a deudas: cualquier día, cualquier valor */
function catAbono(d){let c=cfg.categorias.find(x=>x.deudaId===d.id&&!x.fijo)||cfg.categorias.find(x=>x.deudaId===d.id);
  if(!c){c={id:newId(),nombre:('Abono a '+d.nombre).slice(0,60),tipo:'gasto',mensual:0,cuando:'ambas',fijo:false,enRitmo:false,deudaId:d.id};cfg.categorias.push(c);saveCfg()}
  return c}
function pintarDeudas(){const box=$('#deudabox');if(!box)return;
  const ds=sheet.tipo==='gasto'?cfg.deudas.filter(d=>(+d.total||0)-deudaPagado(d)>0||(catById(sheet.cat)||{}).deudaId===d.id):[];
  if(!ds.length){box.innerHTML='';return}
  const sel=(catById(sheet.cat)||{}).deudaId;
  const chips=ds.map(d=>`<button type="button" data-deuda="${esc(d.id)}" aria-pressed="${sel===d.id}"><span class="dot" style="background:var(--warn)"></span>${esc(d.nombre)}</button>`).join('');
  let hint='';if(sel){const d=cfg.deudas.find(x=>x.id===sel);if(d){const pag=deudaPagado(d),viejo=sheet.editId?(movs.find(m=>m.id===sheet.editId)||{}).monto||0:0,debe=Math.max((+d.total||0)-pag+viejo,0),m=parseMoney($('#fMonto').value);
    hint=`<p class="small" style="margin:6px 0 0">Debes <b class="num">${fmt(debe)}</b>${m?` · después de este abono te quedan <b class="num">${fmt(Math.max(debe-m,0))}</b>${m>=debe?' <span class="tag good">¡La terminas!</span>':''}`:''}</p>`}}
  box.innerHTML=`<div class="lbl" style="margin-bottom:6px">¿Es un abono a una deuda?</div><div class="catgrid">${chips}</div>${hint}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-deuda]');if(b&&$('#deudabox').contains(b)){const d=cfg.deudas.find(x=>x.id===b.dataset.deuda);if(d){sheet.cat=catAbono(d).id;sheet.nueva=false;paintSheet()}return}
  const a=e.target.closest('[data-act="abonar"]');if(a){const d=cfg.deudas.find(x=>x.id===a.dataset.id);if(d){const c=catAbono(d);openSheet({tipo:'gasto',cat:c.id})}}});
document.addEventListener('input',e=>{if(e.target.id==='fMonto'&&!$('#sheet').hidden)pintarDeudas()});

db=cloudDb;
db.doc('fin/config').onSnapshot(s=>{cfg=s.exists?JSON.parse(JSON.stringify(s.data())):null;loaded=true;render()});
db.collection('movs').onSnapshot(s=>{movs=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()});
(async()=>{
  if(!CONF.supabaseUrl||!CONF.supabaseAnonKey||!window.supabase){document.querySelector('.tabbar').hidden=true;
    view.innerHTML='<div class="empty"><h2>Falta conectar la base de datos</h2><p>Escribe la URL y la clave pública de Supabase en el archivo config.js.</p></div>';return}
  sb=window.supabase.createClient(CONF.supabaseUrl,CONF.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){user=session&&session.user;authView='nuevaclave';showAuth();return}
    const nu=session?session.user:null;
    if(!nu){if(user||!entered){user=null;showAuth()}return}
    if(!user||user.id!==nu.id){user=nu;entered=false;setTimeout(enterApp,0)}});
})();
</script>
